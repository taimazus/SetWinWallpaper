name: Build & Release Sahand Nama (Windows)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Standalone Windows x64 Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Test Suite
        run: dotnet run --project SahandNama.Tests/SahandNama.Tests.csproj

      - name: Verify Windows PowerShell Script Contracts
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File SahandNama.Tests/ScriptContractTests.ps1

      - name: Publish Standalone Windows x64
        run: |
          dotnet publish SahandNama/SahandNama.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o output/standalone

      - name: Create Portable Zip Packages
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$(([xml](Get-Content SahandNama/SahandNama.csproj)).Project.PropertyGroup.Version)" }
          Compress-Archive -Path "output/standalone/*" -DestinationPath "output/SahandNama-${ver}-win-x64.zip" -Force
          Copy-Item "output/standalone/SahandNama.exe" "output/SahandNama-${ver}-win-x64.exe" -Force

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: SahandNama-win-x64
          path: output/

      - name: Attach Assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.8.1" }
          gh release view $ver *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $ver "output/SahandNama-${ver}-win-x64.exe" "output/SahandNama-${ver}-win-x64.zip"
          } else {
            gh release create $ver "output/SahandNama-${ver}-win-x64.exe" "output/SahandNama-${ver}-win-x64.zip" --verify-tag --title "سهند نما $ver" --notes-file "docs/releases/$ver.fa.md" --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
