name: Build & Release Sahand Nama (Windows)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Windows x64 Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Test Suite
        run: dotnet run --project SahandNama.Tests/SahandNama.Tests.csproj

      - name: Publish Standalone Windows x64
        run: |
          dotnet publish SahandNama/SahandNama.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o output/standalone

      - name: Create Portable Zip Packages
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.7.0" }
          Compress-Archive -Path "output/standalone/*" -DestinationPath "output/SahandNama-${ver}-win-x64.zip" -Force
          Copy-Item "output/standalone/SahandNama.exe" "output/SahandNama-${ver}-win-x64.exe" -Force

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: SahandNama-win-x64
          path: output/

      - name: Attach Assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.7.0" }
          gh release create $ver "output/SahandNama-${ver}-win-x64.exe" "output/SahandNama-${ver}-win-x64.zip" --title "Sahand Nama $ver" --notes "انتشار رسمی نرم‌افزار سهند نما" --latest || gh release upload $ver "output/SahandNama-${ver}-win-x64.exe" "output/SahandNama-${ver}-win-x64.zip" --clobber
